services:
  suite:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - suite_data:/data
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: automation
      POSTGRES_USER: automation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automation -d automation"]
      interval: 5s
      timeout: 5s
      retries: 10
  # Set DATABASE_URL=postgresql+psycopg://automation:...@db:5432/automation
  # to use PostgreSQL. SQLite remains the default for a zero-configuration local start.
volumes:
  suite_data:
  postgres_data:
