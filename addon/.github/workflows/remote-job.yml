name: Suite Remote Job
on:
  workflow_dispatch:
    inputs:
      job_id: {description: Job ID, required: true, type: string}
      task: {description: Task, required: true, type: string}
      payload_json: {description: JSON payload, required: true, type: string}
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Execute allow-listed remote task
        env:
          TASK: ${{ inputs.task }}
          PAYLOAD: ${{ inputs.payload_json }}
        run: |
          python - <<'PY'
          import json, os
          p=json.loads(os.environ["PAYLOAD"])
          task=os.environ["TASK"]
          if task == "healthcheck": print("runner healthy")
          elif task == "echo": print(json.dumps(p))
          else: raise SystemExit("Task is not enabled in this runner workflow")
          PY
      - name: Send authenticated completion callback
        if: ${{ always() }}
        env:
          BASE: ${{ secrets.ADDON_CALLBACK_URL }}
          SECRET: ${{ secrets.ADDON_CALLBACK_SECRET }}
          JOB: ${{ inputs.job_id }}
          OUTCOME: ${{ job.status }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          if not os.environ["BASE"] or not os.environ["SECRET"]:
              print("Callback not configured"); raise SystemExit(0)
          data=json.dumps({"job_id":os.environ["JOB"],"status":"completed" if os.environ["OUTCOME"]=="success" else "failed"}).encode()
          req=urllib.request.Request(os.environ["BASE"].rstrip("/")+"/api/runner/callback",data=data,
            headers={"Content-Type":"application/json","X-Callback-Secret":os.environ["SECRET"]},method="POST")
          urllib.request.urlopen(req,timeout=20).read()
          PY
