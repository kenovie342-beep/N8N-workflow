  const conc = h("input", { type: "number", min: 1, max: 100, value: s.max_concurrency }), tz = h("input", { value: s.default_timezone });
  const win = h("input", { value: s.n8n_windows.join(", ") }), en = h("input", { type: "checkbox" }); en.checked = st.enabled;
  main.append(h("h2", {}, "Settings"), h("div", { class: "card" }, h("div", { class: "row" }, h("div", {}, h("label", {}, "Maximum concurrent jobs (1-100)"), conc, h("div", { class: "hint" }, "Enforced inside the database claim; applies at once.")), h("div", {}, h("label", {}, "Default timezone"), tz)),
    h("label", {}, "n8n hosting windows (HH:MM-HH:MM, comma separated, in the timezone above)"), win,
    h("label", {}, h("span", {}, "Keep n8n running in these windows "), en),
    h("p", {}, h("button", { class: "b", onclick: () => guard(out, async () => { await api("/settings/app", { method: "PUT", body: { max_concurrency: +conc.value, default_timezone: tz.value, n8n_windows: win.value.split(",").map((x) => x.trim()).filter(Boolean), n8n_enabled: en.checked } }); flash(out, "Saved", true); }) }, "Save"))), out);
}
render();
</script></body></html>
