name: Deploy suite Worker
# Deploys addon/serverless to Cloudflare from GitHub (no computer needed). Run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-suite-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: addon/serverless
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUITE_ADMIN_USERNAME: ${{ secrets.SUITE_ADMIN_USERNAME }}
      SUITE_ADMIN_PASSWORD: ${{ secrets.SUITE_ADMIN_PASSWORD }}
      SUITE_CALLBACK_SECRET: ${{ secrets.SUITE_CALLBACK_SECRET }}
      SUITE_N8N_TOKEN: ${{ secrets.SUITE_N8N_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: addon/serverless
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check required repository secrets
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUITE_ADMIN_PASSWORD SUITE_CALLBACK_SECRET SUITE_N8N_TOKEN; do
            [ -z "$(printenv $v)" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (Settings -> Secrets and variables -> Actions)"; exit 1; fi
          for v in SUITE_ADMIN_PASSWORD SUITE_CALLBACK_SECRET SUITE_N8N_TOKEN; do
            [ "$(printenv $v | wc -c)" -lt 17 ] && { echo "::error::$v must be at least 16 characters"; exit 1; }
          done
          echo "All required secrets are present."

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Create the D1 database if it does not exist, then wire its id into wrangler.toml
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="suite") | .uuid' | head -n1)
          if [ -z "$id" ]; then
            npx wrangler d1 create suite
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="suite") | .uuid' | head -n1)
          fi
          [ -z "$id" ] && { echo "::error::Could not find or create the D1 database"; exit 1; }
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$id/" wrangler.toml
          grep -q "$id" wrangler.toml && echo "D1 database wired."

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply suite --remote

      - name: Deploy the Worker
        run: npx wrangler deploy

      - name: Set Worker secrets (ENCRYPTION_KEY and SESSION_SECRET are generated once and never replaced)
        run: |
          existing=$(npx wrangler secret list --format json | jq -r '.[].name')
          enc=""; ses=""
          echo "$existing" | grep -qx ENCRYPTION_KEY || enc=$(openssl rand -base64 32)
          echo "$existing" | grep -qx SESSION_SECRET || ses=$(openssl rand -base64 48 | tr -d '\n')
          jq -n --arg u "${SUITE_ADMIN_USERNAME:-admin}" --arg p "$SUITE_ADMIN_PASSWORD" --arg c "$SUITE_CALLBACK_SECRET" --arg n "$SUITE_N8N_TOKEN" --arg e "$enc" --arg s "$ses" \
            '{ADMIN_USERNAME:$u, ADMIN_PASSWORD:$p, CALLBACK_SECRET:$c, N8N_ADDON_API_TOKEN:$n} + (if $e != "" then {ENCRYPTION_KEY:$e} else {} end) + (if $s != "" then {SESSION_SECRET:$s} else {} end)' > /tmp/secrets.json
          npx wrangler secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json
          [ -n "$enc" ] && echo "Generated a new ENCRYPTION_KEY (first deploy)." || echo "ENCRYPTION_KEY already exists; kept."
